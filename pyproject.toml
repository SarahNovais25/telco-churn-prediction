[project]
name = "telco-churn-prediction"
version = "0.1.0"
description = "Customer churn prediction using Machine Learning, PyTorch, MLflow and FastAPI"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "openpyxl",
    "torch",
    "mlflow",
    "fastapi",
    "uvicorn",
    "pydantic",
    "joblib"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"